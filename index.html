<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Photoview</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <section id="login" class="screen" hidden>
    <form id="login-form" class="card">
      <h1>Photoview</h1>
      <p class="muted">Enter the session passphrase from your teacher.</p>
      <input id="passphrase" type="text" placeholder="Session passphrase" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" data-1p-ignore data-lpignore="true" data-bwignore required>
      <button type="submit">Join</button>
      <p id="login-error" class="error" role="alert"></p>
    </form>
  </section>

  <section id="app" hidden>
    <header>
      <h1>Photoview</h1>
      <span id="count" class="muted"></span>
      <span class="spacer"></span>
      <button id="toggle-upload" class="ghost" type="button">Presenter mode</button>
      <button id="logout" class="ghost" type="button">Leave</button>
    </header>

    <form id="upload-form" class="card upload">
      <input id="name" type="text" placeholder="Your name" maxlength="40" required>
      <label class="file">
        <input id="files" type="file" accept="image/jpeg,image/png" multiple required>
        <span id="file-label">Choose photos…</span>
      </label>
      <button type="submit" id="upload-btn">Upload</button>
      <p id="upload-status" class="muted" role="status"></p>
    </form>

    <main id="grid"></main>
    <p id="empty" class="muted center" hidden>No photos yet. Upload the first one!</p>
  </section>

  <div id="lightbox" hidden>
    <img id="lb-img" alt="">
    <div id="lb-caption"></div>
    <button id="lb-prev" class="lb-nav" type="button" aria-label="Previous">‹</button>
    <button id="lb-next" class="lb-nav" type="button" aria-label="Next">›</button>
    <button id="lb-close" type="button" aria-label="Close">×</button>
  </div>

  <script src="app.js"></script>
</body>
</html>
